<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearX</title>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 680px;
  margin: 24px auto;
  padding: 16px;
  line-height: 1.6;
}

button, input { font: inherit; }

button {
  cursor: pointer;
  padding: 10px 18px;
  margin: 8px 10px;
  background-color: #2d7bc9;
  color: #ffffff;
  border: none;
  border-radius: 8px;
}

button:hover { background-color: #2467a8; }

input { padding: 10px; margin: 4px; }

img { max-width: 100%; height: auto; }

[hidden] { display: none !important; }

.laukums {
  width: 360px;
  max-width: 100%;
  min-height: 240px;
  padding: 20px;
  margin: 20px auto;
  border: 3px solid #2d7bc9;
  border-radius: 12px;
  background-color: #37658d;
  color: #ffffff;
  box-sizing: border-box;
}
</style>
</head>
<body>
<h1>Spēles laukums</h1>
<div class="laukums">
  <p>Šeit būs spēle.</p>
</div>
<button>Sākt</button>
<button>Noteikumi</button>
</body>
</html>

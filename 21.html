<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GearX</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #ffffff; color: #222222; }
h1 { color: #0079ca; }
.noteikumi { background-color: #eeeeee; padding: 12px; border-radius: 12px; }
button { background-color: #8b8c8d; color: #ffffff; border: 0; border-radius: 10px; }
button:hover { background-color: #163b61; }
</style>
</head>
<body>
<h1>Mana spēle</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
  <p>Savāc 10 skrūves</p>
  <p>W - kustība uz augšu</p>
  <p>S - kustība uz leju</p>
  <p>A - kustība uz kreisi</p>
  <p>D - kustība uz labi</p>
</section>
<button>Sākt spēli</button>
</body>
</html>
